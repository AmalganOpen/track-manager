# Track Manager Configuration
# Copy this to config.yaml and customize for your setup

# Output directory for downloaded tracks
output_dir: "~/Music/tm/tracks"

# Failed downloads log file
failed_log: "~/Music/tm/failed-downloads.txt"

# Metadata review CSV file
metadata_csv: "tracks-metadata-review.csv"

# Spotdl configuration (OPTIONAL - only needed for Spotify playlists/albums)
# Individual Spotify track URLs work without credentials (downloaded via TIDAL)
spotdl:
  # Spotify API credentials (get from https://developer.spotify.com/dashboard)
  # Leave empty if you don't need Spotify playlist support
  client_id: ""
  client_secret: ""

  # Path to spotdl executable (leave empty to use 'spotdl' from PATH)
  path: ""
  # Alternative: Use a specific Python environment
  # path: "/Users/username/.pyenv/versions/3.12.7/envs/spotdl-env/bin/spotdl"

# DAB Music (LEGACY - currently unused)
# Note: DAB Music service is currently unavailable
# High-quality FLAC downloads now use public TIDAL API (no credentials required)
# These settings are kept for potential future use if DAB Music service returns
dabmusic:
  # Get account from https://dabmusic.xyz (if service returns)
  email: ""
  password: ""
  endpoint: "https://dabmusic.xyz"

# song.link API configuration
songlink:
  # Request timeout in seconds (default: 20)
  # Increase if you experience frequent timeouts
  timeout: 20

  # Maximum retry attempts on failure (default: 3)
  # Set to 1 to disable retries
  max_retries: 3

# Download preferences
downloads:
  # Default format: auto (prefer m4a), m4a, or mp3
  # Note: Quality is always best available (320kbps for MP3, 256kbps for M4A/AAC)
  default_format: "auto"

  # Playlist confirmation threshold (ask before downloading large playlists)
  playlist_confirmation_threshold: 50

# Duplicate detection
duplicates:
  # How to handle duplicates: interactive, skip, or keep
  # interactive: Ask user what to do
  # skip: Skip duplicate files
  # keep: Keep both files
  handling: "interactive"
