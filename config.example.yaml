# Track Manager Configuration
# Copy this to config.yaml and customize for your setup

# Output directory for downloaded tracks
output_dir: "~/Music/tm/tracks"

# Failed downloads log file
failed_log: "~/Music/tm/failed-downloads.txt"

# Metadata review CSV file
metadata_csv: "tracks-metadata-review.csv"

# Spotdl configuration (OPTIONAL - only needed for Spotify playlists/albums)
# Individual Spotify track URLs work without credentials (downloaded via TIDAL)
spotdl:
  # Spotify API credentials (get from https://developer.spotify.com/dashboard)
  # Leave empty if you don't need Spotify playlist support
  client_id: ""
  client_secret: ""

# SoundCloud configuration (OPTIONAL)
# Public SoundCloud tracks download as ~128 kbps MP3 (HLS). When the
# uploader enabled "Download file" on a track, an authenticated session
# unlocks the original upload (often WAV/AIFF/FLAC). Provide an OAuth
# token to enable this.
#
# How to get an OAuth token:
#   1. Log in to https://soundcloud.com in your browser.
#   2. Open DevTools → Application → Cookies → https://soundcloud.com
#   3. Copy the value of the `oauth_token` cookie (looks like "2-12345-...").
#
# The token is long-lived (~1 year) and only invalidated by logging out
# or changing your password.
soundcloud:
  oauth_token: ""

# YouTube configuration (OPTIONAL)
# Age-restricted / members-only videos need cookies. Provide either a path to
# a cookies.txt file (Netscape format), or the name of a browser to import
# cookies from (e.g. "chrome", "firefox", "safari", "brave", "edge").
#
# Leave cookies empty unless you actually need them. Stale cookies (YouTube
# rotates them often) cause HTTP 403 for *public* videos. If downloads start
# failing with 403, re-login to YouTube in that browser or clear this field.
#
# See: https://github.com/yt-dlp/yt-dlp/wiki/FAQ#how-do-i-pass-cookies-to-yt-dlp
youtube:
  # Path to a Netscape-format cookies.txt file
  cookies_file: ""
  # Browser to import cookies from (chrome, firefox, safari, brave, edge, ...)
  cookies_from_browser: ""

  # Override yt-dlp's YouTube player clients. Leave empty for defaults.
  # Pinning old workarounds (mweb, tv_embedded, android_vr) often makes
  # HTTP 403 worse. Only set this if you know a specific client still works.
  player_clients: ""

  # Optional GVS PO token in yt-dlp's "<client>.gvs+<token>" format.
  # See: https://github.com/yt-dlp/yt-dlp/wiki/PO-Token-Guide
  po_token: ""

# Instagram configuration (OPTIONAL)
# Reels and most posts need a logged-in session. Provide either a path to a
# cookies.txt file (Netscape format), or the name of a browser to import
# cookies from (chrome, firefox, safari, brave, edge, ...).
#
# If cookies_from_browser is empty, youtube.cookies_from_browser is reused
# (browser cookies include Instagram when you are logged in there).
#
# See: https://github.com/yt-dlp/yt-dlp/wiki/FAQ#how-do-i-pass-cookies-to-yt-dlp
instagram:
  cookies_file: ""
  cookies_from_browser: ""

# Soulseek (optional lossless fallback via sockseek CLI)
# No signup page: pick a unique username/password; first login creates the
# account. Requires `sockseek` (formerly sldl) on PATH:
# https://github.com/fiso64/sockseek/releases
# Enabled only when both username and password are set. Runs after public
# Qobuz/TIDAL proxies fail, before YouTube/spotdl fallback.
# Etiquette: sockseek does not share files — if you already run Nicotine+/slskd,
# use a *separate* Soulseek account here to avoid connection conflicts.
soulseek:
  username: ""
  password: ""
  # Optional path to the binary (default: find sockseek or sldl on PATH)
  binary: ""
  timeout_seconds: 180
  length_tol_seconds: 3

# DAB Music (LEGACY - currently unused)
# Note: DAB Music service is currently unavailable
# High-quality FLAC downloads now use public TIDAL API (no credentials required)
# These settings are kept for potential future use if DAB Music service returns
dabmusic:
  # Get account from https://dabmusic.xyz (if service returns)
  email: ""
  password: ""
  endpoint: "https://dabmusic.xyz"

# song.link / Odesli API configuration
# song.link is used to resolve track URLs → TIDAL IDs for lossless downloads.
# Auth is optional: no key is required. If you have one, it is sent as the
# `key` query param for higher rate limits (email developers@song.link).
# The live API currently returns 401 PUBLIC_API_ACCESS_DEPRECATED without a
# key; when that happens remaining lookups this run are skipped.
# Successful lookups are cached in ~/.cache/track-manager/ to minimise API calls.
songlink:
  api_key: ""

  # Request timeout in seconds (default: 20)
  timeout: 20

  # Maximum retry attempts on 429 (default: 3)
  max_retries: 3

# Download preferences
downloads:
  # Default format: auto, aiff, m4a, or mp3
  # 'auto' resolves to AIFF (uncompressed PCM 16-bit/44.1 kHz) for maximum
  # gear compatibility. Files are larger but play on every device. Override
  # to m4a (AAC 256k) or mp3 (CBR 320) when storage matters more.
  default_format: "auto"

  # Playlist confirmation threshold (ask before downloading large playlists)
  playlist_confirmation_threshold: 50

# Duplicate detection
duplicates:
  # How to handle duplicates: interactive, skip, or keep
  # interactive: Ask user what to do
  # skip: Skip duplicate files
  # keep: Keep both files
  handling: "interactive"
