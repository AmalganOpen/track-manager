[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    real_process_check: exercise the real Rekordbox process scan instead of the stubbed one
addopts = 
    --verbose
    --cov=track_manager
    --cov-report=html
    --cov-report=term-missing
